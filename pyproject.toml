[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "isc-ai"
version = "0.3.0"
description = "InterSystems IRIS/TrakCare MCP server with CCR-aware write gates, plus the CLI that manages its per-project configuration."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
socks = ["PySocks>=1.7"]

[project.scripts]
isc-ai = "isc_ai.cli:main"

[tool.setuptools]
packages = ["isc_ai", "isc_ai.locales"]

[tool.setuptools.package-data]
# Globs must cover every file type the bundle actually carries: the manifest verifies
# each one by sha256, so a resource missing from the wheel is a broken installation, not
# a degraded one. Assets and references are matched wholesale for that reason.
isc_ai = [
  "resources/*.json",
  "resources/MCP/*.template",
  "resources/opencode/*.tsx",
  "resources/harness/*.json",
  "resources/harness/agents/*.md",
  "resources/harness/commands/*.md",
  "resources/harness/skills/*/*.md",
  "resources/harness/skills/*/references/*",
  "resources/harness/skills/*/assets/*",
]
